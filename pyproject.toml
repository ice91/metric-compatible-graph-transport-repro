[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcgt-repro"
version = "1.0.0"
description = "Reproducibility artifact for the exact finite-graph rank witnesses in Gauge Orbits, Cycle Completeness, and Reference Design in Metric-Compatible Graph Transport."
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.11"
authors = [{name = "Chien-Chih Chen"}]

[tool.setuptools.packages.find]
where = ["src"]
